name: Job Search Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job search agent
        run: python agent.py
